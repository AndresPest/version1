<!-- stress-detector.component.html AQUI EMPIEZA VERSION 2 -->

<div class="contenedor">
  <h2>Detección facial en tiempo real</h2>
  <div class="layout">
    <!-- Video + Canvas -->
    <div class="video-section">
      <video #video width="0" height="0" autoplay muted playsinline></video>
      <canvas #canvas width="640" height="480"></canvas>
    </div>

    <!-- Panel de resultados -->
    <div class="resultados">
        <h3>Panel de resultados</h3>
        <p>Estado emocional: <span *ngIf="mensaje" class="emocion">{{ mensaje }}</span></p>
        <p>Nivel de estrés: <span *ngIf="porcentaje" class="porcentaje">{{ porcentaje }}</span></p>
        <p>Tiempo actual: {{ tiempo }}</p>  
        <button (click)="enviarImagenAlDetectorEstres()">Capturar</button>  
    </div>

    <!-- Configuración ->

        Fuente de video:

      </label>
      <label>

    <!-- Visualización CNN -->
    <div class="visualizacion">
      <h2>Cuestionario de Estrés (Nivel 1)</h2>

        <form (ngSubmit)="enviarCuestionario()">
        <div *ngFor="let p of preguntas; let i = index">
            <label>{{ p.texto }}</label><br />
            <select [(ngModel)]="preguntas[i].valor" name="pregunta{{i}}">
            <option [value]=0>Nunca</option>
            <option [value]=1>Casi nunca</option>
            <option [value]=2>De vez en cuando</option>
            <option [value]=3>A menudo</option>
            <option [value]=4>Muy a menudo</option>
            </select>
            <br /><br />
        </div>
        <button type="submit">Enviar respuestas</button>
        </form>
        <p *ngIf="resultadoEncuesta">✅ Resultado: {{ resultadoEncuesta }}</p>
    </div>
  </div>
</div>
